<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Profile image placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131d33"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
  </defs>

  <rect width="480" height="480" fill="url(#bg)"/>

  <!-- simple person silhouette -->
  <circle cx="240" cy="186" r="62" fill="#22304d"/>
  <path d="M120 400c0-66 54-118 120-118s120 52 120 118z" fill="#22304d"/>

  <!-- camera hint -->
  <g transform="translate(240 352)">
    <rect x="-46" y="-22" width="92" height="62" rx="12" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="0" cy="9" r="15" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <path d="M-18 -22 l10 -14 h16 l10 14" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <text x="240" y="452" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="20" font-weight="600" fill="#7c8aa5">[YOUR PROFILE IMAGE]</text>
</svg>
